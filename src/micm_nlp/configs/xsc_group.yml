# src/micm_nlp/configs/xsc_group.yml
# A group of runs over the shipped finetune example: the same unit config at two
# seeds, with the test phase switched on (the unit config ships with it off).
# Paths resolve relative to this file, so the group works wherever
# `micm-nlp init-examples` copied it. Run the preprocess example first, then:
#
#   python -m micm_nlp run-group --group-config micm-nlp-examples/xsc_group.yml
#
# Each entry lands in artefacts/evals/runs/bloom/xsc_group/<time>_<name>/ with
# config.yml, valid_res.csv and test_res.csv. `overrides:` sets any config value
# per entry by dotted path.

configs:
  finetune: ./xsc_finetune.yml

runs:
  - config: finetune
    name: seed_1
    seed: 1
    overrides: {test.run: true, test.zero_shot_only: false}
  - config: finetune
    name: seed_2
    seed: 2
    overrides: {test.run: true, test.zero_shot_only: false}
