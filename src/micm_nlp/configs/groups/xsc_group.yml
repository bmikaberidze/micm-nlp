# src/micm_nlp/configs/groups/xsc_group.yml
# A group of runs over the shipped finetune example: the same unit config at two
# seeds. Paths resolve relative to this file, so the group works wherever
# `micm-nlp init-examples` copied it. Run the preprocess example first, then:
#
#   python -m micm_nlp run-group --group-config micm-nlp-examples/groups/xsc_group.yml
#
# Each entry lands in artefacts/runs/bloom/xsc_group/<time>_<name>/ with
# config.yml, run.json, eval_validation_before_train.csv,
# eval_validation_after_train.csv and model/wandb links. The example dataset
# ships no test split (`comes_with_splits.test: false`), so there is no test
# phase here and no test_after_train.csv / predictions_after_train.csv;
# a dataset with a test split gets one metrics file and one predictions file
# per test pass. Add `overrides:` to an entry to set any config value by dotted
# path, e.g.
# `overrides: {training_args.args.learning_rate: 1e-4}`.

configs:
  finetune: ../xsc_finetune.yml

runs:
  - config: finetune
    name: seed_1
    seed: 1
  - config: finetune
    name: seed_2
    seed: 2
