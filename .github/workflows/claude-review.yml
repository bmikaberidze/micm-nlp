name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Public repo: PRs from forks get no secrets, so this job cannot review them.
    # Do NOT switch to `pull_request_target` to fix that — it runs with secrets
    # against untrusted fork code.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # id-token: write is required — the action uses OIDC to exchange for
      # the Claude Code GitHub App token (separate from the Anthropic OAuth
      # token in CLAUDE_CODE_OAUTH_TOKEN, which only authenticates Anthropic).
      # Dropping this breaks token exchange: "Could not fetch an OIDC token".
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses Max-plan subscription via OAuth token (no API billing).
          # Generate locally with: `claude setup-token`, then set as repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. Focus on:

            - **Spec compliance** — if the change implements something declared in CLAUDE.md, FEATURES.md or docs/source/config.md, verify it actually matches that spec
            - **Code quality** — clarity, naming, single responsibility per file
            - **Over-engineering** — flag speculative interfaces, single-method classes with no state, dead-code paths, "v2-hook" placeholders that don't pay for themselves. This project explicitly favors simple, no-ceremony code; question rather than wave through.
            - **Correctness** — bugs, unhandled edge cases, exception propagation, async correctness
            - **Test quality** — do tests verify behavior, or just mock behavior? Are tests for new code missing?
            - **Security** — this is a public PyPI package. `WANDB_API_KEY` / `HF_TOKEN` live only in the gitignored `.env`: flag any committed token, and any code that logs or prints the env/settings object wholesale. Flag new unsafe loading of files a user may have downloaded: `pickle.load`, `torch.load` without `weights_only=True`, `yaml.load` instead of `safe_load`, `trust_remote_code=True` as a default. Class/target names from YAML (`utils.resolve_cls`, `group.py` import resolution) must not be widened to arbitrary import paths
            - **Compatibility** — `peft` is pinned to `0.14.0` because XPE subclasses its internals: any bump is a breaking change. Paper-era XPE checkpoints (`peft_type='P_TUNING'` + `encoder_ratio` in `adapter_config.json`) must still load. Changes to `tests/golden/*.json` need a stated reason, not a silent `REWRITE_GOLDEN`. YAML config schema changes must update `docs/source/config.md` and the example configs
            - **Scope** — experiment-specific logic (language groups, result aggregation, dispatch) belongs in consumer repos, not this toolkit; `models/xpe/` stays split into its seven modules

            The PR branch is pre-checked out in the working directory. You can read any project file for context (CLAUDE.md, plan docs, etc.).

            Use `gh pr comment` for the top-level verdict + summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific issues at specific lines.
            Only post GitHub comments — don't submit review text as conversation messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
