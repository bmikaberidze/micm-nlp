name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR supersedes the review still running on the old head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Public repo: PRs from forks get no secrets, so this job cannot review them —
    # skip them rather than fail. Do NOT switch to `pull_request_target` to fix that:
    # it runs with secrets against untrusted fork code.
    # Drafts are skipped too; marking one ready for review triggers the run.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # id-token: write is required — the action uses OIDC to exchange for
      # the Claude Code GitHub App token (separate from the Anthropic OAuth
      # token in CLAUDE_CODE_OAUTH_TOKEN, which only authenticates Anthropic).
      # Dropping this breaks token exchange: "Could not fetch an OIDC token".
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses Max-plan subscription via OAuth token (no API billing).
          # Generate locally with: `claude setup-token`, then set as repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR to micm-nlp, a research framework for NLP published on PyPI.
            The PR branch is checked out in the working directory; read CLAUDE.md first,
            then the diff (`gh pr diff`), then whatever files you need for context.

            Report only real problems. No praise, no restating the diff, no style nits a
            linter would catch. If nothing is wrong, say so in one line.

            Check:

            - **Correctness** — bugs, unhandled edge cases, swallowed exceptions. Verify
              behaviour by reading function bodies, not signatures.
            - **Simplicity** — this project favours plain, no-ceremony code. Flag
              speculative interfaces, stateless single-method classes, dead code paths and
              placeholders that do not pay for themselves.
            - **Tests** — new behaviour needs a test that checks behaviour, not mocks.
              Several tests pin prose to code (`test_pipeline_stages`, `test_docs_urls`,
              `test_example_configs`, `test_tagline_consistency`): a change to one side
              must update the other, not the test.
            - **Config schema** — sections are pydantic models in `config.py`. A new or
              renamed key must update `docs/source/config.md` and the shipped configs in
              `src/micm_nlp/configs/`. Renames must raise on the old name (see the
              `ds.splits` validator), because sections accept unknown keys silently.
            - **Run output contract** — the trainer is the only writer of a run directory;
              the config is read-only for everything that consumes it (facts about a run go
              to `info.json`). `run()` and `TRAINER.run()` return a `RunOutput`; a custom
              runner is `run(config, ctx) -> RunOutput`. Group-config overrides are strict
              (`apply_override` raises on unknown keys) — do not loosen that.
            - **Compatibility** — `peft` is pinned to `0.14.0` because XPE subclasses its
              internals: any bump is a breaking change. Paper-era XPE checkpoints
              (`peft_type='P_TUNING'` plus `encoder_ratio`) must still load. Changes to
              `tests/golden/*.json` need a stated reason, not a silent `REWRITE_GOLDEN`.
              A user-facing change needs a CHANGELOG entry, marked **Breaking:** when it is.
            - **Security** — `WANDB_API_KEY` / `HF_TOKEN` live only in the gitignored
              `.env`: flag a committed token, or code that prints the environment or
              settings wholesale. Flag new unsafe loading of downloaded files:
              `pickle.load`, `torch.load` without `weights_only=True`, `yaml.load` instead
              of `safe_load`, `trust_remote_code=True` as a default. YAML `cls` names
              resolve only against registered `@micm_plugin`s and the
              `*_SOURCE_MODULES` lists — never a dotted import path. Plugin discovery
              importing every workspace file that decorates something with
              `@micm_plugin` is deliberate and settled; flag only a widening of what it
              imports or skips, not the design. (`--runner` taking any module or script
              path is deliberate too: it comes from the command line, not from a config.)
            - **Docs** — the README is the single source for anything the docs site also
              shows (pulled in with `{include}` between `<!-- start:… -->` markers); a
              second copy of the same prose, or a renamed or moved marker without updating
              `docs/source/`, is a bug. Notes use GitHub alert syntax (`> [!NOTE]`), not
              MyST `:::{note}`, so they render on GitHub too.
            - **Scope** — experiment-specific logic (language groups, result aggregation,
              dispatch) belongs in consumer repos, not here. `models/xpe/` keeps its
              seven-module split.

            Post only GitHub comments, never conversation text:
            - one top-level comment with `gh pr comment`: a verdict line
              (**Approve** / **Changes requested** / **Comment**) and a short list of findings;
            - `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
              for each finding tied to specific lines.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
