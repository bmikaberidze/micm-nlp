[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micm-nlp"
version = "0.3.1"
description = "NLP research toolkit built on HuggingFace Transformers"
authors = [
    { name = "Beso Mikaberidze", email = "beso.mikaberidze@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
# Upper bounds, not exact pins. This is a library: an exact pin makes micm-nlp
# uninstallable beside anything needing a different version, while a bound still
# stops a major release arriving unannounced. The exception is peft, whose internals
# the Cross-Prompt Encoder subclasses -- raising that one is a breaking-change
# review, not a routine upgrade.
#
# Exact versions belong in requirements-lock.txt, which records the environment the
# published results were produced in. This list says what can work; the lock says
# what was run.
dependencies = [
    "tqdm",
    # Floor is 2.2, not something newer: torch dropped macOS-Intel wheels after
    # 2.2.2, and a higher floor makes a source install impossible on those
    # machines. Tested against 2.5 and 2.14.
    "torch>=2.2,<3",
    "nltk",
    "aenum",
    "peft==0.14.0",
    "rich",
    "wandb",
    "numpy<3",
    "spacy",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml",
    "pandas",
    "seqeval",
    "opentsne",
    "requests",
    "datasets<6",
    "evaluate",
    "lightning",
    "datasketch",
    "matplotlib",
    "transformers>=4.48,<4.50",
    "scikit-learn",
    "python-dotenv",
    "sentencepiece",
    "nvidia-ml-py3",
    "accelerate",
]

[project.urls]
Homepage = "https://github.com/bmikaberidze/micm-nlp"
Repository = "https://github.com/bmikaberidze/micm-nlp"
Issues = "https://github.com/bmikaberidze/micm-nlp/issues"

[project.scripts]
micm-nlp = "micm_nlp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name
]

[tool.ruff.format]
quote-style = "single"

[tool.hatch.build.targets.wheel]
packages = ["src/micm_nlp"]
