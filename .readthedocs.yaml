# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Note: micm-nlp itself is NOT installed here. The API reference is generated by
# sphinx-autoapi, which parses src/ statically, so the build needs only the four
# packages in docs/requirements.txt — not torch, transformers, spacy or lightning.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
